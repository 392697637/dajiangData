<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>空域用空计划 Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.92/Build/Cesium/Widgets/widgets.css" />
    <link rel="stylesheet" href="time.css" />
  </head>
  <body data-page="plan">
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <h1>聊城市低空综合感知服务平台</h1>
          <span>LIAOCHENG CITY LOW-ALTITUDE COMPREHENSIVE PERCEPTION SERVICE PLATFORM</span>
        </div>
        <div class="header-time">
          <strong id="clockText">00:00:00</strong>
          <span id="dateText">2026-10-09</span>
        </div>
      </header>

      <main>
        <aside class="nav-panel">
          <div class="nav-section">
            <strong>空域设置</strong>
            <a href="#block" data-page-link="block">空域区块</a>
            <a class="active" href="#plan" data-page-link="plan">用空计划</a>
          </div>
        </aside>

        <aside class="sidebar panel">
          <section class="filters">
            <div class="section-title">
              <h2 id="filterTitle">用空计划</h2>
              <button id="sidebarAddBlockBtn" class="block-only" type="button">+ 新增</button>
            </div>
            <div class="filter-grid">
              <label class="page-plan-only">
                使用日期
                <input id="useDate" type="date" value="2026-10-09" />
              </label>
              <label class="plan-only">
                空域类型
                <select id="airspaceType">
                  <option value="">全部</option>
                  <option value="POINT">点</option>
                  <option value="LINE">线</option>
                  <option value="POLYGON">面</option>
                </select>
              </label>
              <label>
                空域编号
                <input id="airspaceCode" placeholder="支持模糊查询" />
              </label>
              <label>
                空域名称
                <input id="airspaceName" placeholder="支持模糊查询" />
              </label>
              <label class="state-filter">
                启用状态
                <select id="airspaceState">
                  <option value="">全部</option>
                  <option value="true">启用</option>
                  <option value="false">停用</option>
                </select>
              </label>
            </div>
            <div class="filter-actions">
              <button id="searchBtn">查询</button>
              <button id="resetBtn" class="secondary">重置</button>
              <button id="publishPlanBtn" class="secondary page-plan-only" type="button">发布用空计划</button>
            </div>
          </section>

          <section class="results">
            <div class="result-head">
              <h2 id="resultTitle">当天空域区块</h2>
              <span id="resultCount" class="result-count"></span>
            </div>
            <div id="blockList"></div>
            <div id="blockPager" class="pager"></div>
          </section>
        </aside>

        <section class="panel">
          <div class="stage">
            <div id="cesiumContainer"></div>
            <div class="map-toolbar block-only">
              <button id="addBlockBtn" type="button">新增空域区块</button>
            </div>
            <section class="plan-popup" hidden>
              <div class="popup-head">
                <strong id="popupTitle">详情</strong>
                <button type="button" id="popupClose">×</button>
              </div>
              <div id="popupContent" class="popup-content"></div>
            </section>
            <div class="legend">
              <label class="legend-item"><input type="checkbox" checked /><i class="main-airspace-state"></i>主空域</label>
              <label class="legend-item"><input type="checkbox" checked /><i class="control-state"></i>生效中</label>
              <label class="legend-item"><input type="checkbox" checked /><i class="monitor-state"></i>有计划</label>
              <label class="legend-item"><input type="checkbox" checked /><i class="alarm-state"></i>无计划</label>
            </div>
            <div class="timeline">
              <div class="timeline-top">
                <button id="playBtn" class="secondary" title="播放时间轴">播放</button>
                <button id="backBtn" class="secondary" title="后退一小时">-1小时</button>
                <strong id="timelineTime">00:00:00</strong>
                <input id="timeSlider" type="range" min="0" max="86399" value="0" step="1" />
                <button id="forwardBtn" class="secondary" title="前进一小时">+1小时</button>
              </div>
              <div class="timeline-scale">
                <span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span>
              </div>
              <div id="timelineSegments" class="timeline-segments"></div>
              <div id="timelineNote" class="timeline-note"></div>
            </div>
          </div>
        </section>
      </main>

      <footer>
        当前为前后端联调 Demo：airspace.json / airspace-block.json / airspace-plan.json 模拟后端返回。
      </footer>

      <section id="blockFormModal" class="modal" hidden>
        <div class="modal-panel">
          <div class="modal-head">
            <strong id="blockFormTitle">空域信息</strong>
            <button id="blockFormClose" type="button">×</button>
          </div>
          <div class="modal-body">
            <label class="required">空域编号<input id="formAirspaceCode" /></label>
            <label class="required">空域名称<input id="formAirspaceName" /></label>
            <label class="required">空域高度<input id="formAirspaceHeight" type="number" /><span class="field-unit">m</span></label>
            <fieldset class="shape-field">
              <legend class="required">空域形状</legend>
              <label><input id="shapePoint" name="shapeType" type="radio" value="POINT" checked />圆形</label>
              <label><input id="shapePolygon" name="shapeType" type="radio" value="POLYGON" />多边形</label>
              <select id="formAirspaceType" hidden>
                <option value="POINT">点</option>
                <option value="LINE">线</option>
                <option value="POLYGON">面</option>
              </select>
            </fieldset>
            <div class="draw-actions">
              <strong>空域绘制</strong>
              <button id="blockDrawBtn" class="secondary" type="button">自定义绘制</button>
              <button id="blockClearDrawBtn" class="secondary" type="button">导入KML</button>
              <span id="blockDrawTip">圆形取中心点，多边形左键取点、右键结束</span>
            </div>
            <label class="circle-field required">圆点坐标<input id="formAirspaceCoords" /><button class="inline-pick" type="button">拾取</button></label>
            <label class="circle-field">圆形半径<input id="formUnitName" type="number" /><span class="field-unit">m</span></label>
            <label class="polygon-field textarea-field">多边形范围<textarea id="formAirspacePolygon" rows="4"></textarea></label>
            <label class="check-metric"><input type="checkbox" />空域面积<span class="metric-value"><output id="formAirspaceArea">0</output>km²</span></label>
            <label class="check-metric"><input type="checkbox" />空域周长<span class="metric-value"><output id="formAirspacePerimeter">0</output>km</span></label>
            <label class="switch-field">
              启用状态
              <span class="switch-buttons">
                <button id="formStateEnable" type="button">启用</button>
                <button id="formStateDisable" type="button">禁用</button>
              </span>
              <select id="formAirspaceState" hidden>
                <option value="true">启用</option>
                <option value="false">停用</option>
              </select>
            </label>
            <label hidden>项目ID<input id="formUnitId" /></label>
          </div>
          <div class="modal-actions">
            <button id="blockFormDelete" class="danger" type="button">删除</button>
            <button id="blockFormCancel" class="secondary" type="button">取消</button>
            <button id="blockFormSave" type="button">保存</button>
          </div>
        </div>
      </section>

      <section id="planFormModal" class="modal" hidden>
        <div class="modal-panel">
          <div class="modal-head">
            <strong id="planFormTitle">新增用空计划</strong>
            <button id="planFormClose" type="button">×</button>
          </div>
          <div class="modal-body">
            <label>
              空域区块
              <select id="formPlanBlock"></select>
            </label>
            <label>使用日期<input id="formPlanDate" type="date" /></label>
            <label>开始时间<input id="formPlanStart" type="time" step="1" /></label>
            <label>结束时间<input id="formPlanEnd" type="time" step="1" /></label>
            <label hidden>最低高度<input id="formPlanMinHeight" type="number" /></label>
            <label hidden>最高高度<input id="formPlanMaxHeight" type="number" /></label>
            <label hidden>缓冲高度<input id="formPlanBufferHeight" type="number" /></label>
            <label>
              计划状态
              <select id="formPlanStatus">
                <option value="false">可用</option>
                <option value="true">不可用</option>
              </select>
            </label>
            <label>备注<input id="formPlanRemark" /></label>
          </div>
          <div class="modal-actions">
            <button id="planFormSave" type="button">保存</button>
            <button id="planFormCancel" class="secondary" type="button">取消</button>
          </div>
        </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/cesium@1.92/Build/Cesium/Cesium.js"></script>
    <script src="airspace-block.js"></script>
    <script src="airspace-plan.js"></script>
    <script src="time.js"></script>
  </body>
</html>
